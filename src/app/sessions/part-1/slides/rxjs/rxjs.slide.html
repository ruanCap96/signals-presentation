<app-definition>For UI state: <em>read the current value directly</em>.</app-definition>
<section class="compare">
  @for (a of approaches; track a.tag; let i = $index) {
    <article class="step" [class.step-hidden]="steps.current() < i">
      <span class="tag" [class]="a.tone">{{ a.tag }}</span>
      <app-code file="state" [code]="a.state" />
      <app-code file="on click" [code]="a.change" />
      <app-code file="template" [code]="a.template" />
    </article>
  }
</section>
